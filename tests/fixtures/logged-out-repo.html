<script type="application/json" data-target="react-app.embeddedData">{"payload":{"codeViewRepoRoute":{"path":"/","refInfo":{"name":"main","listCacheKey":"v0:1786836144.0","canEdit":false,"refType":"branch","currentOid":"d6ccbed57cd08e668da6eada0ed40dbd047bedde"},"tree":{"items":[{"name":".github","path":".github","contentType":"directory"},{"name":"bridge","path":"bridge","contentType":"directory"},{"name":"extension","path":"extension","contentType":"directory"},{"name":"scripts","path":"scripts","contentType":"directory"},{"name":"skills/ghshot","path":"skills/ghshot","contentType":"directory","hasSimplifiedPath":true},{"name":"store","path":"store","contentType":"directory"},{"name":"tests","path":"tests","contentType":"directory"},{"name":".editorconfig","path":".editorconfig","contentType":"file"},{"name":".gitignore","path":".gitignore","contentType":"file"},{"name":"CHANGELOG.md","path":"CHANGELOG.md","contentType":"file"},{"name":"CODE_OF_CONDUCT.md","path":"CODE_OF_CONDUCT.md","contentType":"file"},{"name":"CONTRIBUTING.md","path":"CONTRIBUTING.md","contentType":"file"},{"name":"LICENSE","path":"LICENSE","contentType":"file"},{"name":"Makefile","path":"Makefile","contentType":"file"},{"name":"PRIVACY.md","path":"PRIVACY.md","contentType":"file"},{"name":"README.md","path":"README.md","contentType":"file"},{"name":"SECURITY.md","path":"SECURITY.md","contentType":"file"}],"totalCount":17,"templateDirectorySuggestionUrl":null,"readme":null,"showBranchInfobar":false},"userNameDisplayConfiguration":null,"treeExpanded":false,"symbolsExpanded":false,"copilotSWEAgentEnabled":false,"copilotAccessAllowed":false,"isOverview":true,"overview":{"banners":{"shouldRecommendReadme":false,"isPersonalRepo":false,"showUseActionBanner":false,"actionSlug":null,"actionId":null,"showProtectBranchBanner":false,"requiredCustomPropertyValuesMissingCount":0,"transactionalMessageBanner":null,"publishBannersInfo":{"dismissActionNoticePath":"/settings/dismiss-notice/publish_action_from_repo","releasePath":"/albarralnunez/ghshot/releases/new?marketplace=true","showPublishActionBanner":false},"interactionLimitBanner":null,"showInvitationBanner":false,"inviterName":null,"actionsMigrationBannerInfo":{"releaseTags":[],"showImmutableActionsMigrationBanner":false,"initialMigrationStatus":null},"copilotSurveyBanner":null,"showSpammyBanner":false,"blockedContributorsBanner":null,"codespacesSurveyBanner":null},"codeButton":{"contactPath":"/contact","isEnterprise":false,"local":{"protocolInfo":{"httpAvailable":true,"sshAvailable":null,"httpUrl":"https://github.com/albarralnunez/ghshot.git","showCloneWarning":null,"sshUrl":null,"sshCertificatesRequired":null,"sshCertificatesAvailable":null,"ghCliUrl":"gh repo clone albarralnunez/ghshot","defaultProtocol":"http","newSshKeyUrl":"/settings/ssh/new","setProtocolPath":"/users/set_protocol?protocol_type=clone"},"platformInfo":{"cloneUrl":"https://desktop.github.com","showVisualStudioCloneButton":false,"visualStudioCloneUrl":"https://windows.github.com","showXcodeCloneButton":false,"xcodeCloneUrl":"xcode://clone?repo=https%3A%2F%2Fgithub.com%2Falbarralnunez%2Fghshot","zipballUrl":"/albarralnunez/ghshot/archive/refs/heads/main.zip"}},"newCodespacePath":"/codespaces/new?hide_repo_select=true&repo=1282387928"},"popovers":{"rename":null,"renamedParentRepo":null},"commitCount":"19","overviewFiles":[{"displayName":"README.md","repoName":"ghshot","refName":"main","path":"README.md","preferredFileType":"readme","tabName":"README","richText":"<article class=\"markdown-body entry-content container-lg\" itemprop=\"text\"><div class=\"markdown-heading\" dir=\"auto\"><h1 tabindex=\"-1\" class=\"heading-element\" dir=\"auto\">ghshot</h1><a id=\"user-content-ghshot\" class=\"anchor\" aria-label=\"Permalink: ghshot\" href=\"#ghshot\"><svg data-component=\"Octicon\" class=\"octicon octicon-link\" viewBox=\"0 0 16 16\" version=\"1.1\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z\"></path></svg></a></div>\n<p dir=\"auto\"><a href=\"https://github.com/albarralnunez/ghshot/actions/workflows/ci.yml\"><img src=\"https://github.com/albarralnunez/ghshot/actions/workflows/ci.yml/badge.svg\" alt=\"CI\" style=\"max-width: 100%;\"></a>\n<a href=\"/albarralnunez/ghshot/blob/main/LICENSE\"><img src=\"https://camo.githubusercontent.com/fdf2982b9f5d7489dcf44570e714e3a15fce6253e0cc6b5aa61a075aac2ff71b/68747470733a2f2f696d672e736869656c64732e696f2f62616467652f4c6963656e73652d4d49542d79656c6c6f772e737667\" alt=\"License: MIT\" data-canonical-src=\"https://img.shields.io/badge/License-MIT-yellow.svg\" style=\"max-width: 100%;\"></a></p>\n<p dir=\"auto\">Upload images (screenshots, diagrams) to GitHub PRs, issues, and comments from the\nterminal \u2014 and get markdown-ready URLs back. GitHub has <strong>no API</strong> for attaching images\nand <code>gh</code> can't do it (<a href=\"https://github.com/cli/cli/discussions/4745\" data-hovercard-type=\"discussion\" data-hovercard-url=\"/cli/cli/discussions/4745/hovercard\">cli/cli#4745</a>).\n<code>ghshot</code> fills the gap.</p>\n<p dir=\"auto\">It ships as an agent <strong>skill</strong> (a small bash script) plus a tiny local <strong>bridge</strong> and a\n<strong>Chrome extension</strong>. Together they upload through your <em>existing</em> github.com browser\nsession, producing a <code>user-attachments</code> URL that renders <strong>inline</strong> and is\n<strong>access-controlled to the repo</strong> \u2014 works on <strong>private</strong> repos, with <strong>no cookie\nextraction and no stored secret</strong>.</p>\n<div class=\"markdown-heading\" dir=\"auto\"><h2 tabindex=\"-1\" class=\"heading-element\" dir=\"auto\">How it works</h2><a id=\"user-content-how-it-works\" class=\"anchor\" aria-label=\"Permalink: How it works\" href=\"#how-it-works\"><svg data-component=\"Octicon\" class=\"octicon octicon-link\" viewBox=\"0 0 16 16\" version=\"1.1\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z\"></path></svg></a></div>\n<div class=\"snippet-clipboard-content notranslate position-relative overflow-auto\" data-snippet-clipboard-copy-content=\"ghshot.sh \u2500\u2500HTTP\u2500\u2500\u25b6 local bridge (127.0.0.1) \u25c0\u2500\u2500long-poll\u2500\u2500 Chrome extension \u2500\u2500fetch(your session)\u2500\u2500\u25b6 github.com\"><pre class=\"notranslate\"><code>ghshot.sh \u2500\u2500HTTP\u2500\u2500\u25b6 local bridge (127.0.0.1) \u25c0\u2500\u2500long-poll\u2500\u2500 Chrome extension \u2500\u2500fetch(your session)\u2500\u2500\u25b6 github.com\n</code></pre></div>\n<p dir=\"auto\">The extension uses the session already in your browser to call GitHub's <code>user-attachments</code>\nendpoint, so the asset is visible only to people who can see the repo. The script never\ntouches your cookie; the only local secret is the loopback bridge token.</p>\n<div class=\"markdown-heading\" dir=\"auto\"><h2 tabindex=\"-1\" class=\"heading-element\" dir=\"auto\">Install</h2><a id=\"user-content-install\" class=\"anchor\" aria-label=\"Permalink: Install\" href=\"#install\"><svg data-component=\"Octicon\" class=\"octicon octicon-link\" viewBox=\"0 0 16 16\" version=\"1.1\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z\"></path></svg></a></div>\n<div class=\"markdown-heading\" dir=\"auto\"><h3 tabindex=\"-1\" class=\"heading-element\" dir=\"auto\">1. The skill</h3><a id=\"user-content-1-the-skill\" class=\"anchor\" aria-label=\"Permalink: 1. The skill\" href=\"#1-the-skill\"><svg data-component=\"Octicon\" class=\"octicon octicon-link\" viewBox=\"0 0 16 16\" version=\"1.1\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z\"></path></svg></a></div>\n<div class=\"highlight highlight-source-shell notranslate position-relative overflow-auto\" dir=\"auto\" data-snippet-clipboard-copy-content=\"npx skills add albarralnunez/ghshot\"><pre>npx skills add albarralnunez/ghshot</pre></div>\n<p dir=\"auto\">Your agent (Claude Code, Codex, Cursor, \u2026) then knows to use it whenever you ask to\nattach a screenshot to a PR. To run it directly, invoke the script by its <strong>full path</strong>\ninside the skill directory:</p>\n<div class=\"highlight highlight-source-shell notranslate position-relative overflow-auto\" dir=\"auto\" data-snippet-clipboard-copy-content=\"/path/to/ghshot/skills/ghshot/ghshot.sh shot.png\"><pre>/path/to/ghshot/skills/ghshot/ghshot.sh shot.png</pre></div>\n<div class=\"markdown-heading\" dir=\"auto\"><h3 tabindex=\"-1\" class=\"heading-element\" dir=\"auto\">2. The bridge</h3><a id=\"user-content-2-the-bridge\" class=\"anchor\" aria-label=\"Permalink: 2. The bridge\" href=\"#2-the-bridge\"><svg data-component=\"Octicon\" class=\"octicon octicon-link\" viewBox=\"0 0 16 16\" version=\"1.1\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z\"></path></svg></a></div>\n<p dir=\"auto\">A single python3-stdlib executable. No pip, no venv.</p>\n<div class=\"highlight highlight-source-shell notranslate position-relative overflow-auto\" dir=\"auto\" data-snippet-clipboard-copy-content=\"bridge/ghshot-bridge            # binds 127.0.0.1:41330, prints its URL + token hint\nbridge/ghshot-bridge --print-token   # show the token to paste into the extension\"><pre>bridge/ghshot-bridge            <span class=\"pl-c\"><span class=\"pl-c\">#</span> binds 127.0.0.1:41330, prints its URL + token hint</span>\nbridge/ghshot-bridge --print-token   <span class=\"pl-c\"><span class=\"pl-c\">#</span> show the token to paste into the extension</span></pre></div>\n<p dir=\"auto\">It auto-creates a token at <code>~/.config/ghshot/bridge-token</code> (chmod 0600) unless\n<code>GHSHOT_BRIDGE_TOKEN</code> is set. Override the port with <code>GHSHOT_BRIDGE_PORT</code> (default 41330).</p>\n<div class=\"markdown-heading\" dir=\"auto\"><h3 tabindex=\"-1\" class=\"heading-element\" dir=\"auto\">3. The Chrome extension</h3><a id=\"user-content-3-the-chrome-extension\" class=\"anchor\" aria-label=\"Permalink: 3. The Chrome extension\" href=\"#3-the-chrome-extension\"><svg data-component=\"Octicon\" class=\"octicon octicon-link\" viewBox=\"0 0 16 16\" version=\"1.1\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z\"></path></svg></a></div>\n<p dir=\"auto\">Get the extension one of two ways:</p>\n<ul dir=\"auto\">\n<li>\n<p dir=\"auto\"><strong>From the latest release (no clone needed)</strong> \u2014 download and unzip:</p>\n<div class=\"highlight highlight-source-shell notranslate position-relative overflow-auto\" dir=\"auto\" data-snippet-clipboard-copy-content=\"curl -fsSL -o ghshot-extension.zip \\\n  https://github.com/albarralnunez/ghshot/releases/latest/download/ghshot-extension.zip\nunzip ghshot-extension.zip -d ghshot-extension\"><pre>curl -fsSL -o ghshot-extension.zip \\\n  https://github.com/albarralnunez/ghshot/releases/latest/download/ghshot-extension.zip\nunzip ghshot-extension.zip -d ghshot-extension</pre></div>\n<p dir=\"auto\">(<a href=\"https://github.com/albarralnunez/ghshot/releases/latest\">latest release page</a> \u00b7\n<a href=\"https://github.com/albarralnunez/ghshot/releases/latest/download/ghshot-extension.zip\">direct download</a> \u2014\nboth always point at the newest version.)</p>\n</li>\n<li>\n<p dir=\"auto\"><strong>From a clone</strong> \u2014 just use the <code>extension/</code> directory in this repo.</p>\n</li>\n</ul>\n<p dir=\"auto\">Then load it:</p>\n<ol dir=\"auto\">\n<li>Open <code>chrome://extensions</code>, enable <strong>Developer mode</strong>.</li>\n<li><strong>Load unpacked</strong> \u2192 select the unzipped <code>ghshot-extension/</code> folder (or the repo's\n<code>extension/</code> directory).</li>\n<li>Open the extension's <strong>Options</strong>, set:\n<ul dir=\"auto\">\n<li><strong>Bridge URL</strong>: <code>http://127.0.0.1:41330</code> (default)</li>\n<li><strong>Token</strong>: the value from <code>bridge/ghshot-bridge --print-token</code></li>\n</ul>\n</li>\n<li>Click <strong>Test connection</strong> \u2014 it should report <code>ok</code> and the version.</li>\n</ol>\n<p dir=\"auto\">Keep Chrome open and signed in to github.com. The extension long-polls the bridge and\nperforms uploads from your session. <strong>No cookies are exported and no password is stored.</strong></p>\n<div class=\"markdown-heading\" dir=\"auto\"><h2 tabindex=\"-1\" class=\"heading-element\" dir=\"auto\">Remote bridge &amp; multiple bridges</h2><a id=\"user-content-remote-bridge--multiple-bridges\" class=\"anchor\" aria-label=\"Permalink: Remote bridge &amp; multiple bridges\" href=\"#remote-bridge--multiple-bridges\"><svg data-component=\"Octicon\" class=\"octicon octicon-link\" viewBox=\"0 0 16 16\" version=\"1.1\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z\"></path></svg></a></div>\n<p dir=\"auto\">The CLI/bridge and your browser don't have to be on the same machine. To upload from a\nproject on <strong>machine A</strong> while the browser/session lives on <strong>machine B</strong>, bind the bridge\nto a private address both can reach and point the extension at it:</p>\n<div class=\"highlight highlight-source-shell notranslate position-relative overflow-auto\" dir=\"auto\" data-snippet-clipboard-copy-content=\"# on machine A (where ghshot runs):\nghshot-bridge --host 10.0.0.5            # an address machine B can reach; or GHSHOT_BRIDGE_HOST=...\nexport GHSHOT_BRIDGE_URL=http://10.0.0.5:41330   # so the CLI hits the same address\"><pre><span class=\"pl-c\"><span class=\"pl-c\">#</span> on machine A (where ghshot runs):</span>\nghshot-bridge --host 10.0.0.5            <span class=\"pl-c\"><span class=\"pl-c\">#</span> an address machine B can reach; or GHSHOT_BRIDGE_HOST=...</span>\n<span class=\"pl-k\">export</span> GHSHOT_BRIDGE_URL=http://10.0.0.5:41330   <span class=\"pl-c\"><span class=\"pl-c\">#</span> so the CLI hits the same address</span></pre></div>\n<p dir=\"auto\">Then in the extension <strong>Options</strong> on machine B, add a bridge with URL\n<code>http://10.0.0.5:41330</code> and that bridge's token. The bridge stays <strong>token-gated and\norigin-guarded</strong>, but is now reachable on the chosen interface \u2014 only bind an address on a\n<strong>trusted private network</strong> (never <code>0.0.0.0</code> on a public one).</p>\n<p dir=\"auto\">The extension supports <strong>multiple bridges</strong> at once \u2014 add as many URL+token pairs as you\nlike (e.g. a local <code>127.0.0.1</code> bridge and a remote one); it polls them all and handles\nwhichever has a job. (The extension reaches a bridge at any address via the bridge's own\nCORS headers, so a remote bridge needs no extra extension permission \u2014 just a reachable\nURL and its token.)</p>\n<div class=\"markdown-heading\" dir=\"auto\"><h2 tabindex=\"-1\" class=\"heading-element\" dir=\"auto\">Quickstart</h2><a id=\"user-content-quickstart\" class=\"anchor\" aria-label=\"Permalink: Quickstart\" href=\"#quickstart\"><svg data-component=\"Octicon\" class=\"octicon octicon-link\" viewBox=\"0 0 16 16\" version=\"1.1\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z\"></path></svg></a></div>\n<div class=\"highlight highlight-source-shell notranslate position-relative overflow-auto\" dir=\"auto\" data-snippet-clipboard-copy-content=\"ghshot.sh shot.png                      # \u2192 inline markdown for the current repo\nghshot.sh --pr 42 shot.png              # upload + comment on PR #42\nghshot.sh --pr shot.png                 # no number \u2192 the current branch's PR\nghshot.sh --pick shot.png               # interactively pick repo + PR (needs fzf)\nghshot.sh --repo owner/name --pr 42 shot.png   # target a repo from any directory\nghshot.sh --issue 10 bug.png            # upload + comment on issue #10\nghshot.sh --raw shot.png                # raw URL only\nghshot.sh --json shot.png               # {&quot;url&quot;,&quot;markdown&quot;,&quot;visibility&quot;}\n\n# stdout is pipe-safe (URL/markdown only); progress goes to stderr\nghshot.sh shot.png | gh pr comment 42 --body-file -\"><pre>ghshot.sh shot.png                      <span class=\"pl-c\"><span class=\"pl-c\">#</span> \u2192 inline markdown for the current repo</span>\nghshot.sh --pr 42 shot.png              <span class=\"pl-c\"><span class=\"pl-c\">#</span> upload + comment on PR #42</span>\nghshot.sh --pr shot.png                 <span class=\"pl-c\"><span class=\"pl-c\">#</span> no number \u2192 the current branch's PR</span>\nghshot.sh --pick shot.png               <span class=\"pl-c\"><span class=\"pl-c\">#</span> interactively pick repo + PR (needs fzf)</span>\nghshot.sh --repo owner/name --pr 42 shot.png   <span class=\"pl-c\"><span class=\"pl-c\">#</span> target a repo from any directory</span>\nghshot.sh --issue 10 bug.png            <span class=\"pl-c\"><span class=\"pl-c\">#</span> upload + comment on issue #10</span>\nghshot.sh --raw shot.png                <span class=\"pl-c\"><span class=\"pl-c\">#</span> raw URL only</span>\nghshot.sh --json shot.png               <span class=\"pl-c\"><span class=\"pl-c\">#</span> {\"url\",\"markdown\",\"visibility\"}</span>\n\n<span class=\"pl-c\"><span class=\"pl-c\">#</span> stdout is pipe-safe (URL/markdown only); progress goes to stderr</span>\nghshot.sh shot.png <span class=\"pl-k\">|</span> gh pr comment 42 --body-file -</pre></div>\n<p dir=\"auto\">The target repo is resolved from <code>GHSHOT_REPO</code>, else <code>gh repo view --json nameWithOwner</code>\nin the current directory. <code>gh</code> is only used for that and for <code>--pr</code>/<code>--issue</code> comments;\nthe upload itself needs only <code>curl</code> + the bridge + the extension.</p>\n<div class=\"markdown-heading\" dir=\"auto\"><h2 tabindex=\"-1\" class=\"heading-element\" dir=\"auto\">Troubleshooting</h2><a id=\"user-content-troubleshooting\" class=\"anchor\" aria-label=\"Permalink: Troubleshooting\" href=\"#troubleshooting\"><svg data-component=\"Octicon\" class=\"octicon octicon-link\" viewBox=\"0 0 16 16\" version=\"1.1\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z\"></path></svg></a></div>\n<ul dir=\"auto\">\n<li><strong><code>bridge not reachable</code></strong> \u2192 start <code>bridge/ghshot-bridge</code> and keep it running. Check it:\n<code>curl -fsS http://127.0.0.1:41330/healthz</code>.</li>\n<li><strong><code>no bridge token found</code></strong> \u2192 set <code>GHSHOT_BRIDGE_TOKEN</code> or start the bridge to create the\ntoken file, then paste the token into the extension Options.</li>\n<li><strong><code>upload failed</code> / <code>not signed in to github.com</code></strong> \u2192 sign in to github.com in the same\nChrome profile the extension runs in, confirm the extension is loaded, then retry.</li>\n<li><strong><code>gh not authenticated</code></strong> \u2192 run <code>gh auth login</code>.</li>\n</ul>\n<div class=\"markdown-heading\" dir=\"auto\"><h2 tabindex=\"-1\" class=\"heading-element\" dir=\"auto\">Managing / deleting uploads</h2><a id=\"user-content-managing--deleting-uploads\" class=\"anchor\" aria-label=\"Permalink: Managing / deleting uploads\" href=\"#managing--deleting-uploads\"><svg data-component=\"Octicon\" class=\"octicon octicon-link\" viewBox=\"0 0 16 16\" version=\"1.1\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z\"></path></svg></a></div>\n<p dir=\"auto\">Assets live under <code>github.com/user-attachments/assets/&lt;uuid&gt;</code> and are tied to the repo's\nACL. To remove one, delete the comment/PR body that references it; orphaned attachments are\nnot publicly listable.</p>\n<div class=\"markdown-heading\" dir=\"auto\"><h2 tabindex=\"-1\" class=\"heading-element\" dir=\"auto\">Security model</h2><a id=\"user-content-security-model\" class=\"anchor\" aria-label=\"Permalink: Security model\" href=\"#security-model\"><svg data-component=\"Octicon\" class=\"octicon octicon-link\" viewBox=\"0 0 16 16\" version=\"1.1\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z\"></path></svg></a></div>\n<ul dir=\"auto\">\n<li><strong>True access control.</strong> The asset is visible only to accounts that can see the repo.</li>\n<li><strong>No GitHub credential leaves the browser.</strong> Your github.com session is never extracted.\nThe only secret on disk is the local bridge token (<code>~/.config/ghshot/bridge-token</code>, chmod\n0600); it authorizes the bridge to upload through your session, so anyone who holds it can\nupload to repos you can write to while Chrome is open \u2014 treat it as a real credential.</li>\n<li><strong>Never upload secrets anyway.</strong> The skill refuses sensitive-looking filenames and\nnon-images by default \u2014 a best-effort, filename-based guard (it does not inspect file\ncontents, and the bridge does not re-vet uploads); <code>--force</code> bypasses it.</li>\n</ul>\n<div class=\"markdown-heading\" dir=\"auto\"><h2 tabindex=\"-1\" class=\"heading-element\" dir=\"auto\">Uninstall</h2><a id=\"user-content-uninstall\" class=\"anchor\" aria-label=\"Permalink: Uninstall\" href=\"#uninstall\"><svg data-component=\"Octicon\" class=\"octicon octicon-link\" viewBox=\"0 0 16 16\" version=\"1.1\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z\"></path></svg></a></div>\n<div class=\"highlight highlight-source-shell notranslate position-relative overflow-auto\" dir=\"auto\" data-snippet-clipboard-copy-content=\"npx skills remove albarralnunez/ghshot     # remove the skill\n# stop the bridge (Ctrl-C) and rm -f ~/.config/ghshot/bridge-token\n# chrome://extensions \u2192 Remove &quot;ghshot&quot;\"><pre>npx skills remove albarralnunez/ghshot     <span class=\"pl-c\"><span class=\"pl-c\">#</span> remove the skill</span>\n<span class=\"pl-c\"><span class=\"pl-c\">#</span> stop the bridge (Ctrl-C) and rm -f ~/.config/ghshot/bridge-token</span>\n<span class=\"pl-c\"><span class=\"pl-c\">#</span> chrome://extensions \u2192 Remove \"ghshot\"</span></pre></div>\n<div class=\"markdown-heading\" dir=\"auto\"><h2 tabindex=\"-1\" class=\"heading-element\" dir=\"auto\">Publishing the extension</h2><a id=\"user-content-publishing-the-extension\" class=\"anchor\" aria-label=\"Permalink: Publishing the extension\" href=\"#publishing-the-extension\"><svg data-component=\"Octicon\" class=\"octicon octicon-link\" viewBox=\"0 0 16 16\" version=\"1.1\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z\"></path></svg></a></div>\n<p dir=\"auto\">The extension is store-ready. To package it:</p>\n<div class=\"highlight highlight-source-shell notranslate position-relative overflow-auto\" dir=\"auto\" data-snippet-clipboard-copy-content=\"make zip          # \u2192 dist/ghshot-extension-&lt;version&gt;.zip\"><pre>make zip          <span class=\"pl-c\"><span class=\"pl-c\">#</span> \u2192 dist/ghshot-extension-&lt;version&gt;.zip</span></pre></div>\n<p dir=\"auto\">Upload that zip in the <a href=\"https://chrome.google.com/webstore/devconsole\" rel=\"nofollow\">Chrome Web Store dashboard</a>\n(one-time $5 developer registration). Listing copy and permission justifications are in\n<a href=\"/albarralnunez/ghshot/blob/main/store/listing.md\"><code>store/listing.md</code></a>; replace the placeholder\n<a href=\"/albarralnunez/ghshot/blob/main/store\"><code>store/screenshot-1.png</code></a> with real captures (see <a href=\"/albarralnunez/ghshot/blob/main/store/README.md\"><code>store/README.md</code></a>).\nIcons live in <code>extension/icons/</code> and are regenerated with <code>make assets</code>.</p>\n<p dir=\"auto\">Privacy policy: <a href=\"/albarralnunez/ghshot/blob/main/PRIVACY.md\"><code>PRIVACY.md</code></a> (also the policy URL for the store form).</p>\n<p dir=\"auto\">Tip: for personal/small-team use you don't need the store at all \u2014 <strong>Load unpacked</strong> the\n<code>extension/</code> directory from <code>chrome://extensions</code>. The store is only for wider, searchable\ndistribution (expect a permissions-justification review because of the github.com host\naccess). The same MV3 build also works on Firefox (AMO).</p>\n<div class=\"markdown-heading\" dir=\"auto\"><h2 tabindex=\"-1\" class=\"heading-element\" dir=\"auto\">Credits</h2><a id=\"user-content-credits\" class=\"anchor\" aria-label=\"Permalink: Credits\" href=\"#credits\"><svg data-component=\"Octicon\" class=\"octicon octicon-link\" viewBox=\"0 0 16 16\" version=\"1.1\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z\"></path></svg></a></div>\n<p dir=\"auto\">Inspired by <a href=\"https://github.com/vipulgupta2048/gitshot\">vipulgupta2048/gitshot</a>; this is an\nindependent implementation that uploads through your own browser session via the bridge +\nextension.</p>\n<div class=\"markdown-heading\" dir=\"auto\"><h2 tabindex=\"-1\" class=\"heading-element\" dir
